    <path d="M268 222 C270 260 252 284 222 300 C196 316 186 350 188 400 L196 600" transform="translate(3 0)"/>
    <path d="M250 580 C236 640 226 700 238 780 C248 850 262 900 256 962" transform="translate(3 0)"/>
