<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="600" height="1000">
  <!-- Placeholder: an abstract figure in carved stone, one arm reaching up (rising).
       Original art made for 7EightMade Studio. Swap for a real cutout PNG/WebP
       (transparent background, same 3:5 ratio). See studio/README-assets.md -->
  <defs>
    <linearGradient id="stone" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#B9AE9F"/>
      <stop offset=".3" stop-color="#857B70"/>
      <stop offset=".62" stop-color="#4E4640"/>
      <stop offset="1" stop-color="#211D1A"/>
    </linearGradient>
    <radialGradient id="light" cx=".36" cy=".2" r=".6">
      <stop offset="0" stop-color="#FFF1DC" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFF6E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".35" stop-color="#120F0D" stop-opacity="0"/>
      <stop offset=".72" stop-color="#120F0D" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#EE7A3C" stop-opacity=".22"/>
      <stop offset=".35" stop-color="#EE7A3C" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .2  0 0 0 0 .18  0 0 0 0 .16  0 0 0 .7 0"/>
    </filter>
    <filter id="vein" x="0" y="0" width="100%" height="100%">
