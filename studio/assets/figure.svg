      <feColorMatrix in="t" type="matrix" values="0 0 0 0 .32  0 0 0 0 .29  0 0 0 0 .26  0 0 0 -3 1.35"/>
    </filter>
    <clipPath id="body">
      <ellipse cx="312" cy="160" rx="48" ry="62" transform="rotate(-14 312 160)"/>
      <path d="M268 222 C270 260 252 284 222 300 C196 316 186 350 188 400 L196 600 C197 618 216 618 217 600 L228 432 C236 500 248 540 250 580 C236 640 226 700 238 780 C248 850 262 900 256 962 L352 962 C346 900 360 850 368 780 C380 700 368 640 352 580 C356 530 372 470 384 400 C394 360 392 330 372 304 C356 286 344 262 340 222 Z"/>
      <path d="M350 318 C380 246 400 150 416 54 C420 34 446 34 446 54 C440 160 420 262 392 352 Z"/>
      <rect x="196" y="950" width="216" height="40" rx="3"/>
    </clipPath>
  </defs>
  <g clip-path="url(#body)">
    <rect width="600" height="1000" fill="url(#stone)"/>
    <rect width="600" height="1000" filter="url(#vein)"/>
    <rect width="600" height="1000" filter="url(#grain)"/>
    <rect width="600" height="1000" fill="url(#light)"/>
    <rect width="600" height="1000" fill="url(#shade)"/>
    <rect width="600" height="1000" fill="url(#ember)"/>
