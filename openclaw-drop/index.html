<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw Drop — Offer ended | 7EightMade</title>
  <meta name="description" content="The OpenClaw Drop has ended.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B0B0F">
  <link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../brand/fonts.css">
  <style>
    :root {
      --ink: #0B0B0F;
      --paper: #F3EFE6;
      --teal: #5EEAD4;
      --muted: rgba(243,239,230,.62);
      --amber: #FBBF24;
      --amber-ink: #92400E;
      --amber-bg: #FDE68A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: var(--ink);
      color: var(--paper);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 48px 24px 72px; }
    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: var(--teal); margin-bottom: 16px;
    }
    .live-pill {
      display: inline-block; margin-bottom: 14px;
      font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      color: #0B0B0F; background: var(--teal); border: 1px solid #2DD4BF;
      padding: 6px 12px; border-radius: 999px;
    }
    .live-pill.is-mid {
      color: var(--amber-ink); background: var(--amber-bg); border-color: #F59E0B;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 600; letter-spacing: -.03em; line-height: 1.05;
      margin-bottom: 16px;
    }
    .lead { font-size: 17px; color: var(--muted); max-width: 42ch; margin-bottom: 28px; }
    .card {
      border: 1px solid rgba(243,239,230,.12);
      background: #14141c;
      border-radius: 20px;
      padding: 28px 24px;
      margin-bottom: 20px;
    }
    .kicker {
      font-family: Fraunces, Georgia, serif;
      font-size: 22px; font-weight: 600; color: var(--teal);
      margin-bottom: 8px;
    }
    .price { font-size: 42px; font-weight: 700; letter-spacing: -.03em; margin: 8px 0 12px; }
    .price span { font-size: 16px; font-weight: 500; color: var(--muted); }
    .meta { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    .toc { list-style: none; margin: 16px 0 0; display: grid; gap: 8px; }
    .toc li { font-size: 15px; color: var(--paper); }
    .toc strong { color: var(--teal); font-weight: 600; margin-right: 8px; }
    .steps {
      margin-top: 20px; padding-top: 18px;
      border-top: 1px solid rgba(243,239,230,.1);
      font-size: 14px; color: var(--paper); line-height: 1.7;
    }
    .cash { color: var(--teal); font-weight: 700; }
    .clock {
      font-variant-numeric: tabular-nums;
      font-size: 15px; color: var(--teal); margin-top: 16px;
    }
    .clock.is-mid { color: var(--amber); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: #5EEAD4; color: #0B0B0F;
      font-weight: 700; text-decoration: none; font-size: 14px;
      padding: 12px 18px; border-radius: 999px;
    }
    .btn--ghost {
      background: transparent; color: var(--paper);
      border: 1px solid rgba(243,239,230,.22);
    }
    .foot { margin-top: 36px; font-size: 12px; color: rgba(243,239,230,.4); }
    .foot a { color: var(--teal); text-decoration: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="live-pill">Offer ended</p>
    <p class="eyebrow">Cosmic Terminal drop</p>
    <h1>OpenClaw</h1>
    <p class="lead">The 12-hour OpenClaw Drop is over. No more requests for this promo.</p>

    <section class="card" id="closedCard" aria-label="OpenClaw Drop closed">
      <p class="kicker">Offer ended</p>
      <p class="meta">The 12-hour OpenClaw Drop is over. No more requests for this promo.</p>
      <div class="actions">
        <a class="btn" href="../">Back to 7EightMade</a>
        <a class="btn btn--ghost" href="mailto:nuguidd@icloud.com?subject=Free%20AI%20Audit">Book Free AI Audit</a>
      </div>
    </section>

    <p class="foot"><a href="../">← 7EightMade</a> · fall down 7 stand up 8</p>
  </main>
</body>
</html>
