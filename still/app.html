<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Still — lie down | 7EightMade</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0B0F">
  <link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../brand/fonts.css">
  <style>
    :root { --ink:#E8E4D8; --void:#0B0B0F; --muted:#8A8680; --cobalt:#2563FF; --line:rgba(232,228,216,.12); }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; background:var(--void); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    .nav { display:flex; align-items:center; justify-content:space-between; padding:16px 22px; }
    .nav img { height:36px; width:auto; display:block; filter:brightness(1.15); }
    .nav a.back { font-size:12px; font-weight:600; color:var(--muted); text-decoration:none; }
    main { min-height:calc(100vh - 72px); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
    .eyebrow { font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--cobalt); margin-bottom:16px; }
    h1 { font-family:Fraunces,Georgia,serif; font-weight:500; font-size:clamp(36px,7vw,56px); margin-bottom:12px; }
    .lead { color:var(--muted); max-width:28ch; margin-bottom:24px; }
    .line { font-family:Fraunces,Georgia,serif; font-size:clamp(22px,4vw,32px); font-weight:500; min-height:2.6em; max-width:18ch; }
    .n { font-size:12px; color:var(--muted); margin-top:8px; }
    .controls { margin-top:32px; display:flex; gap:10px; justify-content:center; }
    button { min-height:44px; padding:12px 20px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); font:inherit; font-size:14px; font-weight:650; }
    button.primary { background:var(--cobalt); border-color:var(--cobalt); color:#fff; }
    button:disabled { opacity:.35; }
    .hint { margin-top:16px; font-size:12px; color:var(--muted); max-width:36ch; }
    .foot { position:fixed; bottom:0; left:0; right:0; padding:14px 22px; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; }
    .foot a { color:#93b0ff; text-decoration:none; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="../" aria-label="7EightMade"><img src="../brand/logo-horizontal.svg" alt="7EightMade"></a>
    <a class="back" href="./">Still</a>
  </nav>
  <main>
    <p class="eyebrow">Nine lines</p>
    <h1>Still</h1>
    <p class="lead">Hard refresh this page. Then tap Begin.</p>
    <p class="line" id="line">Ready.</p>
    <p class="n" id="n"></p>
    <div class="controls">
      <button class="primary" id="begin" type="button">Begin</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>
    <p class="hint" id="hint">Lines advance after each sentence plus a short pause. Keep the screen on.</p>
  </main>
  <p class="foot"><a href="../">← 7EightMade</a><span>Fall down seven. Stand up eight.</span></p>
  <script>
    var LINES = [
      "It is late enough.",
      "You can put the day down without finishing it.",
      "In.",
      "Out.",
      "Nothing else is required.",
      "The next thought can pass.",
      "Weight in the body.",
      "The room is enough.",
      "Stay. Or sleep. Same."
    ];
    var PAUSE = 6000;
    var i = 0;
    var running = false;
    var wait;
    var lineEl = document.getElementById("line");
    var nEl = document.getElementById("n");
    var hint = document.getElementById("hint");
    var beginBtn = document.getElementById("begin");
    var stopBtn = document.getElementById("stop");

    function speakNow(text, after) {
      if (!window.speechSynthesis) {
        hint.textContent = "No voice in this browser.";
        if (after) after();
        return;
      }
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.78;
      u.volume = 1;
      u.lang = "en-US";
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        if (after) after();
      }
      u.onend = finish;
      u.onerror = finish;
      window.speechSynthesis.speak(u);
      setTimeout(finish, 8000);
    }

    function next() {
      if (!running) return;
      if (i >= LINES.length) {
        stop();
        lineEl.textContent = "Done.";
        return;
      }
      lineEl.textContent = LINES[i];
      nEl.textContent = (i + 1) + " / 9";
      var idx = i;
      i += 1;
      speakNow(LINES[idx], function () {
        if (!running) return;
        wait = setTimeout(next, PAUSE);
      });
    }

    function stop() {
      running = false;
      clearTimeout(wait);
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      beginBtn.disabled = false;
      stopBtn.disabled = true;
    }

    beginBtn.addEventListener("click", function () {
      if (running) return;
      running = true;
      i = 0;
      beginBtn.disabled = true;
      stopBtn.disabled = false;
      if (window.speechSynthesis) window.speechSynthesis.getVoices();
      next();
    });
    stopBtn.addEventListener("click", function () {
      stop();
      lineEl.textContent = "Stopped.";
    });
    setInterval(function () {
      if (running && window.speechSynthesis && window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
    }, 4000);
  </script>
</body>
</html>
