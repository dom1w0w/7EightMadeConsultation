<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLASSBOX — Offer ended | 7EightMade</title>
<meta name="description" content="The Glassbox drop has ended.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06070c">
<style>
  :root {
    --bg: #06070c;
    --panel: #0b0d16;
    --teal: #00ffaa;
    --teal-dim: #00cc88;
    --ink: #d7f5e8;
    --muted: #6b7f76;
    --line: #14241d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 1px, transparent 1px 3px);
    z-index: 50;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 72px 24px 72px; }
  .pill {
    display: inline-block;
    font-size: 12px; font-weight: 700; letter-spacing: 2px;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 999px;
    margin-bottom: 20px;
  }
  .eyebrow { font-size: 12px; letter-spacing: 4px; color: var(--muted); margin-bottom: 14px; }
  h1 {
    font-size: clamp(48px, 11vw, 88px);
    color: var(--teal);
    letter-spacing: 8px;
    text-shadow: 0 0 32px rgba(0,255,170,0.25);
    margin-bottom: 8px;
  }
  .sub { color: var(--muted); font-size: 17px; margin-bottom: 12px; }
  .lead { font-size: 16px; color: var(--ink); margin-bottom: 32px; }
  .card {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 8px;
    padding: 28px 24px;
    margin-bottom: 24px;
  }
  .kicker { color: var(--teal); font-size: 15px; letter-spacing: 4px; margin-bottom: 10px; }
  .meta { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    display: inline-block;
    background: var(--teal); color: #04120c;
    font-weight: 700; text-decoration: none; font-size: 14px; letter-spacing: 1px;
    padding: 12px 20px; border-radius: 6px;
  }
  .btn--ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line);
  }
  .foot { margin-top: 40px; font-size: 12px; color: var(--muted); }
  .foot a { color: var(--teal-dim); text-decoration: none; }
</style>
</head>
<body>
  <main class="wrap">
    <p class="pill">Offer ended</p>
    <p class="eyebrow">7EIGHTMADE DROP</p>
    <h1>GLASSBOX</h1>
    <p class="sub">Every app has secrets.</p>
    <p class="lead">The 11-hour Glassbox drop is over. No more claims for this promo.</p>

    <section class="card" aria-label="Glassbox drop closed">
      <p class="kicker">Offer ended</p>
      <p class="meta">The 11-hour Glassbox drop is over. No more claims for this promo.</p>
      <div class="actions">
        <a class="btn" href="../">Back to 7EightMade</a>
        <a class="btn btn--ghost" href="mailto:nuguidd@icloud.com?subject=Free%20AI%20Audit">Book Free AI Audit</a>
      </div>
    </section>

    <p class="foot"><a href="../">← 7EightMade</a> · Fall Down 7 · Stand Up 8</p>
  </main>
</body>
</html>
